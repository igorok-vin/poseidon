<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head th:replace="fragments::head"></head>
<body>
<div class="container">
	<div class="row">
		<div class="col-6">
			<a href="/bidList/list">Bid List</a>&nbsp;|&nbsp;
			<a href="/curvePoint/list">Curve Points</a>&nbsp;|&nbsp;
			<a href="/rating/list">Ratings</a>&nbsp;|&nbsp;
			<a href="/trade/list">Trade</a>&nbsp;|&nbsp;
			<a href="/ruleName/list">Rule</a> |
			<!--the link is not visible when the user is not an ADMIN-->
			<a sec:authorize="hasAuthority('ADMIN')" href="/user/list">User management</a>
		</div>
		<div class="col-6 text-right">
			Logged in user: <b th:inline="text"  class="user"> [[${#httpServletRequest.remoteUser}]] </b>
			<form th:action="@{/app-logout}" method="POST">
				<input type="submit" value="Logout"/>
			</form>
		</div>
	</div>
	<div class="row" style="margin-top: 1.8em"><h2>Rule List</h2></div>
	<div class="row">
		<a href="/ruleName/add" class="btn btn-primary btn-sm">Add New</a>
		<table class="table table-bordered entitiesList">
			<thead>
				<tr>
					<th>Id</th>
					<th>Name</th>
					<th>Description</th>
					<th>json</th>
					<th>template</th>
					<th>sql</th>
					<th>sqlPart</th>
					<th>Action</th>
				</tr>
			</thead>
			<tbody>
			    <tr th:each="ruleName:${ruleName}">
                    <td style="width: 10%" th:text="${ruleName.id}"></td>
                    <td th:text="${ruleName.name}"></td>
					<td th:text="${ruleName.description}"></td>
					<td th:text="${ruleName.json}"></td>
					<td th:text="${ruleName.template}"></td>
					<td th:text="${ruleName.sqlStr}"></td>
					<td th:text="${ruleName.sqlPart}"></td>
					<td style="width: 15%" class="text-center">
						<a th:href="@{/ruleName/update/{id}(id=${ruleName.id})}">Edit </a> |
						<a id="action_button" th:href="@{/ruleName/delete/{id}(id=${ruleName.id})}">Delete</a>
					</td>
			    </tr>
			</tbody>
		</table>
	</div>

	<div th:replace="fragments::modal_dialog_deletion_warning('tag')"></div>
	<div th:replace="fragments::modal_dialog_confirm_delete('rule name','tag')"></div>

</div>
<script type="text/javascript">
	deletePermission = "[[${DELETE_PERMISSION}]]";
	updatePermission = "[[${UPDATE_PERMISSION}]]";
</script>
<script th:src="@{/js/script.js}" type="text/javascript"></script>
</body>
</html>
