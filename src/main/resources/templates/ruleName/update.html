<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments::head"></head>
<body>
<div class="container">

	<div class="row">
		<h2>Update New Rule</h2>
	</div>

	<div class="row">
		<form action="#" th:action="@{/ruleName/update/{id}(id=${ruleName.id})}" th:object="${ruleName}" method="post" class="form-horizontal entitiesList" style="width: 100%">
			<div class="form-group">
				<label for="name" class="col-sm-2 control-label">Name</label>
				<div class="col-sm-10">
					<input type="text" th:field="*{name}"
						   id="name" placeholder="Name" class="col-4">
					<span class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
				</div>
			</div>

			<div class="form-group">
				<label for="description" class="col-sm-2 control-label">Description</label>
				<div class="col-sm-10">
					<input type="text" th:field="*{description}"
						   id="description" placeholder="Description" class="col-4">
					<span class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
				</div>
			</div>

			<div class="form-group">
				<label for="description" class="col-sm-2 control-label">Json</label>
				<div class="col-sm-10">
					<input type="text" th:field="*{json}"
						   id="json" placeholder="Json" class="col-4">
					<span class="text-danger" th:if="${#fields.hasErrors('json')}" th:errors="*{json}"></span>
				</div>
			</div>

			<div class="form-group">
				<label for="template" class="col-sm-2 control-label">Template</label>
				<div class="col-sm-10">
					<input type="text" th:field="*{template}"
						   id="template" placeholder="Template" class="col-4">
					<span class="text-danger" th:if="${#fields.hasErrors('template')}" th:errors="*{template}"></span>
				</div>
			</div>

			<div class="form-group">
				<label for="sqlStr" class="col-sm-2 control-label">SqlStr</label>
				<div class="col-sm-10">
					<input type="text" th:field="*{sqlStr}"
						   id="sqlStr" placeholder="SqlStr" class="col-4">
					<span class="text-danger" th:if="${#fields.hasErrors('sqlStr')}" th:errors="*{sqlStr}"></span>
				</div>
			</div>

			<div class="form-group">
				<label for="sqlPart" class="col-sm-2 control-label">SqlPart</label>
				<div class="col-sm-10">
					<input type="text" th:field="*{sqlPart}"
						   id="sqlPart" placeholder="SqlPart" class="col-4">
					<span class="text-danger" th:if="${#fields.hasErrors('sqlPart')}" th:errors="*{sqlPart}"></span>
				</div>
			</div>

			<div class="form-group">
				<div class="col-sm-12">
					<input type="hidden" th:field="*{id}">
					<a class="btn btn-danger btn-sm" href="/ruleName/list">Cancel</a>
					<input id="action_button" class="btn btn-primary btn-sm" type="submit" value="Add rule name">
				</div>
			</div>

		</form>
	</div>

	<div th:replace="fragments::modal_dialog_update_warning('tag')"></div>

</div>
<script type="text/javascript">
	deletePermission = "[[${DELETE_PERMISSION}]]";
	updatePermission = "[[${UPDATE_PERMISSION}]]";
</script>
<script th:src="@{/js/script.js}" type="text/javascript"></script>
</body>
</html>
