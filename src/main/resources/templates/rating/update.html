<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments::head"></head>
<body>
<div class="container">

	<div class="row">
		<h2>Update Rating</h2>
	</div>

	<div class="row">
		<form action="#" th:action="@{/rating/update/{id}(id=${rating.id})}" th:object="${rating}" method="post" class="form-horizontal entitiesList" style="width: 100%">
			<div class="form-group">
				<label for="moodysRating" class="col-sm-2 control-label">Moodys Rating</label>
				<div class="col-sm-10">
					<input type="text" th:field="*{moodysRating}"
						   id="moodysRating" placeholder="Moodys Rating" class="col-4">
					<span class="text-danger" th:if="${#fields.hasErrors('moodysRating')}"
						  th:errors="*{moodysRating}"></span>
				</div>
			</div>
			<div class="form-group">
				<label for="sandPRating" class="col-sm-2 control-label">Sand P Rating</label>
				<div class="col-sm-10">
					<input type="text" th:field="*{sandPRating}"
						   id="sandPRating" placeholder="Sand P Rating" class="col-4">
					<span class="text-danger" th:if="${#fields.hasErrors('sandPRating')}"
						  th:errors="*{sandPRating}"></span>
				</div>
			</div>
			<div class="form-group">
				<label for="fitchRating" class="col-sm-2 control-label">Fitch Rating</label>
				<div class="col-sm-10">
					<input type="text" th:field="*{fitchRating}"
						   id="fitchRating" placeholder="Sand P Rating" class="col-4">
					<span class="text-danger" th:if="${#fields.hasErrors('fitchRating')}"
						  th:errors="*{fitchRating}"></span>
				</div>
			</div>
			<div class="form-group">
				<label for="orderNumber" class="col-sm-2 control-label">Order Number</label>
				<div class="col-sm-10">
					<input type="number" th:field="*{orderNumber}"
						   id="orderNumber" placeholder="Sand P Rating" class="col-4">
					<span class="text-danger" th:if="${#fields.hasErrors('orderNumber')}"
						  th:errors="*{orderNumber}"></span>
				</div>
			</div>

			<div class="form-group">
				<div class="col-sm-12">
					<input type="hidden" th:field="*{id}">
					<a class="btn btn-danger btn-sm" href="/rating/list">Cancel</a>
					<input id="action_button" class="btn btn-primary btn-sm" type="submit" value="Update rating">
				</div>
			</div>
		</form>
	</div>

	<div th:replace="fragments::modal_dialog_update_warning('tag')"></div>

</div>
<script type="text/javascript">
	deletePermission = "[[${DELETE_PERMISSION}]]";
	updatePermission = "[[${UPDATE_PERMISSION}]]";
</script>
<script th:src="@{/js/script.js}" type="text/javascript"></script>
</body>
</html>
