version: "3.9"
services:
  database:
    container_name: database_poseidon
    image: mysql
    ports:
      - "3305:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password2024
      - MYSQL_DATABASE=poseidon
    volumes:
      - poseidonDataMySQL:/var/lib/mysql
    restart: always
    deploy:
      replicas: 1

  poseidonapp:
    image: igorokvin/poseidon
    ports:
      - "8082:8082"
    depends_on:
      - database
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/poseidon?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password2024
    restart: always
    deploy:
      replicas: 1

volumes:
  poseidonDataMySQL:
